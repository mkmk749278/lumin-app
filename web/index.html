<!DOCTYPE html>
<html>
<head>
  <!--
    Lumin web (PWA) shell.  Checked in — unlike android/, which CI
    regenerates — because this file, manifest.json, and the FCM service
    worker are hand-edited (2026-07-18 iPhone PWA channel decision).

    The base href placeholder is replaced by `flutter build web`
    (--base-href, default "/").
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Crypto scalping signals by the 360 Crypto Eye engine.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0E1A">

  <!-- iOS meta tags & icons.  black-translucent lets the app draw
       edge-to-edge under the status bar once added to the Home Screen,
       matching the Android edge-to-edge look. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lumin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Lumin</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Match the app's deep-navy background while the engine loads so the
       splash never flashes white (LuminColors.bgDeep). */
    html, body { background: #0A0E1A; margin: 0; padding: 0; }

    /* Pin the document to the viewport (2026-07-26 iPhone setup-screen fix).
     *
     * Flutter draws the whole app into one canvas, so the HTML document
     * itself has nothing to scroll — but iOS Safari does not know that and
     * still rubber-bands the document on any vertical drag the Flutter
     * scene did not consume.  Onboarding is exactly that case: the welcome
     * PageView scrolls horizontally only, and the consent + phone screens
     * are non-scrolling Columns, so every stray vertical drag (including
     * the small one at the start of an ordinary tap) scrolled the document
     * a few pixels under the canvas.  The tap then landed on stale
     * coordinates and only reset the overscroll, which is why the owner had
     * to press "a couple of times" to advance a setup screen while
     * everything after sign-in — where each tab owns a real scrollable that
     * consumes the drag — felt smooth.
     *
     * Taking `body` out of flow at `inset: 0` sizes it to the viewport and
     * leaves the document with nothing to overscroll — Flutter's
     * `flutter-view` is absolutely positioned inside `body`, so it still
     * fills the same box.  `overscroll-behavior: none` stops the chained
     * bounce / pull-to-refresh on Chrome and Android, and `touch-action:
     * manipulation` drops Safari's double-tap-to-zoom recogniser so a
     * second quick tap is delivered as a tap. */
    html {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      position: fixed;
      inset: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
