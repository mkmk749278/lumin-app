<!DOCTYPE html>
<html>
<head>
  <!--
    Lumin web (PWA) shell.  Checked in — unlike android/, which CI
    regenerates — because this file, manifest.json, and the FCM service
    worker are hand-edited (2026-07-18 iPhone PWA channel decision).

    The base href placeholder is replaced by `flutter build web`
    (--base-href, default "/").
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Crypto scalping signals by the 360 Crypto Eye engine.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0E1A">

  <!-- iOS meta tags & icons.  black-translucent lets the app draw
       edge-to-edge under the status bar once added to the Home Screen,
       matching the Android edge-to-edge look. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lumin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Lumin</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Match the app's deep-navy background while the engine loads so the
       splash never flashes white (LuminColors.bgDeep). */
    html, body { background: #0A0E1A; margin: 0; padding: 0; }

    /* Pin the document to the viewport (2026-07-26 iPhone setup-screen fix).
     *
     * Flutter draws the whole app into one canvas, so the HTML document
     * itself has nothing to scroll — but iOS Safari does not know that and
     * still rubber-bands the document on any vertical drag the Flutter
     * scene did not consume.  Onboarding is exactly that case: the welcome
     * PageView scrolls horizontally only, and the consent + phone screens
     * are non-scrolling Columns, so every stray vertical drag (including
     * the small one at the start of an ordinary tap) scrolled the document
     * a few pixels under the canvas.  The tap then landed on stale
     * coordinates and only reset the overscroll, which is why the owner had
     * to press "a couple of times" to advance a setup screen while
     * everything after sign-in — where each tab owns a real scrollable that
     * consumes the drag — felt smooth.
     *
     * Taking `body` out of flow at `inset: 0` sizes it to the viewport and
     * leaves the document with nothing to overscroll — Flutter's
     * `flutter-view` is absolutely positioned inside `body`, so it still
     * fills the same box.  `overscroll-behavior: none` stops the chained
     * bounce / pull-to-refresh on Chrome and Android, and `touch-action:
     * manipulation` drops Safari's double-tap-to-zoom recogniser so a
     * second quick tap is delivered as a tap. */
    html {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      position: fixed;
      inset: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Launch splash (2026-09-23).  Flutter takes 3-4s to boot the web build
     * (measured on the live site) and the page showed nothing but navy for
     * all of it -- which reads as stuck on exactly the visit an ad sends.
     * The brand tile and a slim indeterminate bar hold the space until
     * Flutter's first frame, then fade out.  Pure CSS: nothing here may
     * delay the engine it is waiting for. */
    #lumin-splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #0A0E1A;
      transition: opacity 240ms ease-out;
      font-family: Roboto, -apple-system, "Segoe UI", sans-serif;
    }
    #lumin-splash.gone { opacity: 0; pointer-events: none; }
    #lumin-splash .tile {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #7BD3F7;
      color: #0A0E1A;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      font-weight: 900;
      line-height: 1;
    }
    #lumin-splash .bar {
      width: 120px;
      height: 3px;
      border-radius: 3px;
      background: rgba(123, 211, 247, 0.15);
      overflow: hidden;
    }
    #lumin-splash .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: #7BD3F7;
      animation: lumin-slide 1.1s ease-in-out infinite;
    }
    @keyframes lumin-slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #lumin-splash .bar::after { animation: none; width: 100%; opacity: 0.5; }
    }
    #lumin-splash .stuck {
      display: none;
      color: #94A3B8;
      font-size: 14px;
      text-align: center;
      padding: 0 32px;
      line-height: 1.5;
    }
    #lumin-splash .stuck a { color: #7BD3F7; }
    #lumin-splash.slow .stuck { display: block; }
  </style>
</head>
<body>
  <div id="lumin-splash" aria-label="Loading Lumin" role="status">
    <div class="tile" aria-hidden="true">L</div>
    <div class="bar" aria-hidden="true"></div>
    <!-- If no frame arrives, say so and offer the one fix a reader can do:
         a startup failure used to leave a permanently blank page. -->
    <div class="stuck">Lumin is taking longer than usual to start.<br>
      <a href="" onclick="location.reload(); return false;">Reload</a></div>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('lumin-splash');
      var slow = setTimeout(function () { splash.classList.add('slow'); }, 20000);
      window.addEventListener('flutter-first-frame', function () {
        clearTimeout(slow);
        splash.classList.add('gone');
        setTimeout(function () { splash.remove(); }, 300);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
