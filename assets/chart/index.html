<!DOCTYPE html>
<!--
  Lumin Market Charts — WebView host for TradingView Lightweight Charts™.
  Realises the Flutter↔JS bridge in docs/market_charts_tab.md §8.

  Flutter → JS:  window.lumin.<cmd>(jsonString)
    setCandles({tf, candles:[{time,open,high,low,close}], volumes:[{time,value}],
                precision, minMove, preserveView})
    updateCandle({candle:{...}, volume:{time,value}})
    setIndicators({lines:[{id,color,title,data:[{time,value}]}],
                   rsi:{data:[{time,value}]} | null, showVolume})
    updateIndicators({points:[{id,time,value}], rsi:{time,value} | null})
    setOverlay(ChartOverlay)        clearOverlay()        setTheme({dark})
    setAlertOverlay({lines:[{price,color,title,solid,width}],
                     segments:[{color,points:[{time,value}]}],        // price pane
                     rsiSegments:[{color,points:[{time,value}]}],     // RSI band
                     zones:[{from,low,high,color,borderColor,label}], // shaded S/R box
                     markers:[{time,position,color,shape,text}],
                     focus:{from,to} | null})                          // zoom to setup
  JS → Flutter:  LuminChart.postMessage(jsonString)  -> {event, ...}
    {event:'ready'}  {event:'error',message}  {event:'visibleRangeChanged',from,to}

  Attribution ("Charts by TradingView", link to tradingview.com) is rendered
  in the footer to satisfy the Apache-2.0 / Lightweight Charts terms.
-->
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0e1116; overflow: hidden; }
    #chart { position: absolute; top: 0; left: 0; right: 0; bottom: 16px; }
    #legend {
      position: absolute; top: 4px; left: 6px; z-index: 3; pointer-events: none;
      font: 10px -apple-system, Roboto, sans-serif; color: #9aa7b4;
      text-shadow: 0 0 2px #0e1116; white-space: nowrap;
    }
    #legend .up { color: #26a69a; }
    #legend .dn { color: #ef5350; }
    #attr { position: absolute; right: 6px; bottom: 2px; font: 10px -apple-system, Roboto, sans-serif; }
    #attr a { color: #5d6b7a; text-decoration: none; }
  </style>
  <script src="lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div id="chart"></div>
  <div id="legend"></div>
  <div id="attr"><a href="https://www.tradingview.com/" target="_blank" rel="noopener">Charts by TradingView</a></div>
  <script>
    (function () {
      "use strict";

      function post(obj) {
        try { LuminChart.postMessage(JSON.stringify(obj)); } catch (e) {}
      }

      var dark = true;
      function theme() {
        return dark
          ? { bg: "#0e1116", text: "#9aa7b4", grid: "#1b2027", border: "#2a313a" }
          : { bg: "#ffffff", text: "#33414f", grid: "#eef1f4", border: "#d6dde4" };
      }

      var UP = "#26a69a", DOWN = "#ef5350";
      var VOL_UP = "rgba(38,166,154,0.45)", VOL_DOWN = "rgba(239,83,80,0.45)";

      var el = document.getElementById("chart");
      var legendEl = document.getElementById("legend");
      var chart = LightweightCharts.createChart(el, {
        layout: { background: { color: theme().bg }, textColor: theme().text },
        grid: { vertLines: { color: theme().grid }, horzLines: { color: theme().grid } },
        rightPriceScale: { borderColor: theme().border },
        timeScale: { borderColor: theme().border, timeVisible: true, secondsVisible: false },
        crosshair: { mode: 0 },
        autoSize: true,
      });

      var candleSeries = chart.addCandlestickSeries({
        upColor: UP, downColor: DOWN,
        borderUpColor: UP, borderDownColor: DOWN,
        wickUpColor: UP, wickDownColor: DOWN,
      });

      // Volume as an overlay histogram pinned to the lower 18% of the pane.
      var volSeries = chart.addHistogramSeries({
        priceFormat: { type: "volume" },
        priceScaleId: "vol",
        color: VOL_UP,
        lastValueVisible: false,
        priceLineVisible: false,
      });
      chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });

      var priceLines = [];    // our overlay price lines (entry/SL/TP/BE)
      var lastBarTime = 0;    // newest candle time on the series (seconds)
      var precision = 2;      // active price-axis decimals
      var barsByTime = {};    // time -> {open,close} for volume colouring + legend
      var indSeries = {};     // id -> line series (EMA/SMA overlays)
      var rsiSeries = null;   // RSI line in the bottom band (swaps with volume)
      var rsiGuides = [];     // 30/70 price lines on the RSI series
      var lastCandle = null;  // newest candle payload (legend idle state)
      var lastVolume = null;

      function volColor(c) { return c.close >= c.open ? VOL_UP : VOL_DOWN; }

      function fmt(v) {
        return (v == null || !isFinite(v)) ? "—" : Number(v).toFixed(precision);
      }
      function fmtVol(v) {
        if (v == null || !isFinite(v)) return "—";
        if (v >= 1e9) return (v / 1e9).toFixed(2) + "B";
        if (v >= 1e6) return (v / 1e6).toFixed(1) + "M";
        if (v >= 1e3) return (v / 1e3).toFixed(0) + "K";
        return Number(v).toFixed(0);
      }

      function renderLegend(candle, vol) {
        if (!candle) { legendEl.innerHTML = ""; return; }
        var up = candle.close >= candle.open;
        var chg = candle.open ? ((candle.close - candle.open) / candle.open) * 100 : 0;
        var cls = up ? "up" : "dn";
        legendEl.innerHTML =
          "O " + fmt(candle.open) + "  H " + fmt(candle.high) +
          "  L " + fmt(candle.low) + "  C <span class='" + cls + "'>" + fmt(candle.close) +
          " (" + (chg >= 0 ? "+" : "") + chg.toFixed(2) + "%)</span>" +
          (vol != null ? "  V " + fmtVol(vol) : "");
      }

      function clearOverlay() {
        for (var i = 0; i < priceLines.length; i++) {
          try { candleSeries.removePriceLine(priceLines[i]); } catch (e) {}
        }
        priceLines = [];
        try { candleSeries.setMarkers([]); } catch (e) {}
      }

      var alertLines = [];      // price lines drawn by setAlertOverlay
      var alertSegments = [];   // line series drawn by setAlertOverlay
      var alertZones = [];      // series primitives drawn by setAlertOverlay

      // Shaded S/R zone rectangle (the 100eyes look): a series primitive
      // that fills [zone.low, zone.high] from the zone's start time to the
      // right edge of the pane.  Coordinates are recomputed on every render
      // pass, so the box tracks pan/zoom for free.
      function ZonePrimitive(zone) {
        var self = this;
        this._zone = zone;
        this._renderer = {
          draw: function (target) {
            target.useMediaCoordinateSpace(function (scope) {
              try {
                var vis = chart.timeScale().getVisibleRange();
                if (!vis) return;
                if (self._zone.from > vis.to) return; // zone entirely off-right
                var x1 = 0;
                if (self._zone.from > vis.from) {
                  var c = chart.timeScale().timeToCoordinate(self._zone.from);
                  if (c != null) x1 = c;
                }
                var x2 = scope.mediaSize.width;
                var y1 = candleSeries.priceToCoordinate(self._zone.high);
                var y2 = candleSeries.priceToCoordinate(self._zone.low);
                if (y1 == null || y2 == null || x2 <= x1) return;
                var ctx = scope.context;
                ctx.fillStyle = self._zone.color || "rgba(154,167,180,0.14)";
                ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
                ctx.strokeStyle = self._zone.borderColor || "rgba(154,167,180,0.5)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x1, y1); ctx.lineTo(x2, y1);
                ctx.moveTo(x1, y2); ctx.lineTo(x2, y2);
                ctx.stroke();
                if (self._zone.label) {
                  ctx.font = "10px -apple-system, Roboto, sans-serif";
                  ctx.fillStyle = self._zone.borderColor || "#9aa7b4";
                  ctx.fillText(self._zone.label, x1 + 4, y1 - 4);
                }
              } catch (e) {}
            });
          },
        };
        this._view = {
          zOrder: function () { return "bottom"; },
          renderer: function () { return self._renderer; },
        };
      }
      ZonePrimitive.prototype.updateAllViews = function () {};
      ZonePrimitive.prototype.paneViews = function () { return [this._view]; };

      function clearAlertOverlay() {
        for (var i = 0; i < alertLines.length; i++) {
          try { candleSeries.removePriceLine(alertLines[i]); } catch (e) {}
        }
        alertLines = [];
        for (var j = 0; j < alertSegments.length; j++) {
          try { chart.removeSeries(alertSegments[j]); } catch (e) {}
        }
        alertSegments = [];
        for (var k = 0; k < alertZones.length; k++) {
          try { candleSeries.detachPrimitive(alertZones[k]); } catch (e) {}
        }
        alertZones = [];
        try { candleSeries.setMarkers([]); } catch (e) {}
      }

      function addLine(price, color, title) {
        if (price == null || !isFinite(price) || price <= 0) return;
        priceLines.push(candleSeries.createPriceLine({
          price: price, color: color, lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dashed,
          axisLabelVisible: true, title: title,
        }));
      }

      window.lumin = {
        setCandles: function (s) {
          var d = JSON.parse(s);
          var c = d.candles || [];
          if (d.precision != null) {
            precision = d.precision;
            candleSeries.applyOptions({
              priceFormat: { type: "price", precision: d.precision, minMove: d.minMove || Math.pow(10, -d.precision) },
            });
          }
          barsByTime = {};
          for (var i = 0; i < c.length; i++) barsByTime[c[i].time] = c[i];
          // Preserve the viewport across a data replace (history prepend) so
          // the user's scroll position doesn't jump; initial loads fit content.
          var saved = d.preserveView ? chart.timeScale().getVisibleRange() : null;
          candleSeries.setData(c);
          if (d.volumes) {
            var vols = d.volumes.map(function (v) {
              var bar = barsByTime[v.time];
              return { time: v.time, value: v.value, color: bar ? volColor(bar) : VOL_UP };
            });
            volSeries.setData(vols);
            lastVolume = vols.length ? vols[vols.length - 1].value : null;
          }
          lastBarTime = c.length ? c[c.length - 1].time : 0;
          lastCandle = c.length ? c[c.length - 1] : null;
          if (saved) { try { chart.timeScale().setVisibleRange(saved); } catch (e) {} }
          else chart.timeScale().fitContent();
          renderLegend(lastCandle, lastVolume);
        },
        updateCandle: function (s) {
          try {
            var d = JSON.parse(s);
            // Lightweight Charts' update() throws if time < the newest bar's
            // time — drop stale frames so one bad tick can't wedge live updates.
            if (d.candle && d.candle.time >= lastBarTime) {
              candleSeries.update(d.candle);
              barsByTime[d.candle.time] = d.candle;
              lastBarTime = d.candle.time;
              lastCandle = d.candle;
              if (d.volume) {
                volSeries.update({ time: d.volume.time, value: d.volume.value, color: volColor(d.candle) });
                lastVolume = d.volume.value;
              }
              renderLegend(lastCandle, lastVolume);
            }
          } catch (e) {
            post({ event: "error", message: "updateCandle: " + e });
          }
        },
        setIndicators: function (s) {
          try {
            var d = JSON.parse(s);
            var lines = d.lines || [];
            var keep = {};
            for (var i = 0; i < lines.length; i++) {
              var L = lines[i];
              keep[L.id] = true;
              if (!indSeries[L.id]) {
                indSeries[L.id] = chart.addLineSeries({
                  color: L.color, lineWidth: 1,
                  priceLineVisible: false, lastValueVisible: false,
                  crosshairMarkerVisible: false, title: L.title || "",
                });
              }
              indSeries[L.id].setData(L.data || []);
            }
            for (var id in indSeries) {
              if (!keep[id]) {
                try { chart.removeSeries(indSeries[id]); } catch (e) {}
                delete indSeries[id];
              }
            }
            // RSI lives in the bottom band on its own overlay scale and swaps
            // with the volume histogram (one bottom band on a phone screen).
            if (d.rsi) {
              if (!rsiSeries) {
                rsiSeries = chart.addLineSeries({
                  color: "#b18cf2", lineWidth: 1, priceScaleId: "rsi",
                  priceLineVisible: false, lastValueVisible: true,
                  crosshairMarkerVisible: false, title: "RSI 14",
                });
                chart.priceScale("rsi").applyOptions({ scaleMargins: { top: 0.78, bottom: 0 } });
                rsiGuides = [30, 70].map(function (lvl) {
                  return rsiSeries.createPriceLine({
                    price: lvl, color: "#3a4452", lineWidth: 1,
                    lineStyle: LightweightCharts.LineStyle.Dotted,
                    axisLabelVisible: false, title: "",
                  });
                });
              }
              rsiSeries.setData(d.rsi.data || []);
            } else if (rsiSeries) {
              try { chart.removeSeries(rsiSeries); } catch (e) {}
              rsiSeries = null;
              rsiGuides = [];
            }
            volSeries.applyOptions({ visible: d.showVolume !== false });
          } catch (e) {
            post({ event: "error", message: "setIndicators: " + e });
          }
        },
        updateIndicators: function (s) {
          try {
            var d = JSON.parse(s);
            var pts = d.points || [];
            for (var i = 0; i < pts.length; i++) {
              var p = pts[i];
              if (indSeries[p.id] && p.value != null) {
                indSeries[p.id].update({ time: p.time, value: p.value });
              }
            }
            if (d.rsi && rsiSeries && d.rsi.value != null) rsiSeries.update(d.rsi);
          } catch (e) {
            post({ event: "error", message: "updateIndicators: " + e });
          }
        },
        setOverlay: function (s) {
          var o = JSON.parse(s);
          clearOverlay();
          addLine(o.entry, "#9aa7b4", "Entry");
          addLine(o.sl, o.be_armed ? "#f0a020" : "#ef5350", o.be_armed ? "BE" : "SL");
          addLine(o.tp1, "#26a69a", "TP1");
          addLine(o.tp2, "#26a69a", "TP2");
          addLine(o.tp3, "#26a69a", "TP3");
          if (o.markers && o.markers.length) {
            candleSeries.setMarkers(o.markers.map(function (m) {
              var up = (o.side === "LONG");
              return {
                time: m.time,
                position: up ? "belowBar" : "aboveBar",
                color: m.kind === "entry" ? "#5d8bf4" : (m.kind === "sl" ? "#ef5350" : "#26a69a"),
                shape: up ? "arrowUp" : "arrowDown",
                text: (m.kind || "").toUpperCase(),
              };
            }));
          }
        },
        clearOverlay: clearOverlay,
        // Generic market-alert setup overlay: horizontal price lines
        // (S/R level, alert price), bar markers at the alert candle, and
        // optional two-point segments (RSI-divergence trend line).
        setAlertOverlay: function (s) {
          try {
            var o = JSON.parse(s);
            clearAlertOverlay();
            (o.lines || []).forEach(function (l) {
              if (l.price == null || !isFinite(l.price) || l.price <= 0) return;
              alertLines.push(candleSeries.createPriceLine({
                price: l.price,
                color: l.color || "#9aa7b4",
                lineWidth: l.width || 1,
                lineStyle: l.solid
                  ? LightweightCharts.LineStyle.Solid
                  : LightweightCharts.LineStyle.Dashed,
                axisLabelVisible: true,
                title: l.title || "",
              }));
            });
            (o.segments || []).forEach(function (seg) {
              if (!seg.points || seg.points.length < 2) return;
              var series = chart.addLineSeries({
                color: seg.color || "#f6c85f",
                lineWidth: 2,
                priceLineVisible: false,
                lastValueVisible: false,
                crosshairMarkerVisible: false,
              });
              series.setData(seg.points);
              alertSegments.push(series);
            });
            // Divergence trend line on the RSI band (mirrors the price-pane
            // segment — the 100eyes double-line look).  Bound to the "rsi"
            // price scale; the margins guard keeps it in the bottom band
            // even if it draws before setIndicators created the RSI series.
            (o.rsiSegments || []).forEach(function (seg) {
              if (!seg.points || seg.points.length < 2) return;
              try {
                chart.priceScale("rsi").applyOptions({ scaleMargins: { top: 0.78, bottom: 0 } });
              } catch (e) {}
              var series = chart.addLineSeries({
                color: seg.color || "#f6c85f",
                lineWidth: 2,
                priceScaleId: "rsi",
                priceLineVisible: false,
                lastValueVisible: false,
                crosshairMarkerVisible: false,
              });
              series.setData(seg.points);
              alertSegments.push(series);
            });
            (o.zones || []).forEach(function (z) {
              if (z.from == null || z.low == null || z.high == null) return;
              if (!isFinite(z.low) || !isFinite(z.high) || z.high <= z.low) return;
              var p = new ZonePrimitive(z);
              try {
                candleSeries.attachPrimitive(p);
                alertZones.push(p);
              } catch (e) {}
            });
            if (o.markers && o.markers.length) {
              candleSeries.setMarkers(o.markers.map(function (m) {
                return {
                  time: m.time,
                  position: m.position === "above" ? "aboveBar" : "belowBar",
                  color: m.color || "#f6c85f",
                  shape: m.shape || "circle",
                  text: m.text || "",
                };
              }));
            }
            // Zoom to the setup window (overrides setCandles' fitContent —
            // an alert-opened chart lands ON the setup, not on 500 bars).
            if (o.focus && o.focus.from && o.focus.to && o.focus.to > o.focus.from) {
              try {
                chart.timeScale().setVisibleRange({ from: o.focus.from, to: o.focus.to });
              } catch (e) {}
            }
          } catch (e) {
            post({ event: "error", message: "setAlertOverlay: " + e });
          }
        },
        clearAlertOverlay: clearAlertOverlay,
        setTheme: function (s) {
          dark = !!JSON.parse(s).dark;
          var t = theme();
          chart.applyOptions({
            layout: { background: { color: t.bg }, textColor: t.text },
            grid: { vertLines: { color: t.grid }, horzLines: { color: t.grid } },
            rightPriceScale: { borderColor: t.border },
            timeScale: { borderColor: t.border },
          });
          document.body.style.background = t.bg;
        },
      };

      chart.subscribeCrosshairMove(function (param) {
        if (!param || !param.time) { renderLegend(lastCandle, lastVolume); return; }
        var bar = barsByTime[param.time];
        var v = param.seriesData && param.seriesData.get ? param.seriesData.get(volSeries) : null;
        renderLegend(bar || lastCandle, v ? v.value : null);
      });

      chart.timeScale().subscribeVisibleTimeRangeChange(function (r) {
        if (r) post({ event: "visibleRangeChanged", from: r.from, to: r.to });
      });

      window.addEventListener("error", function (e) {
        post({ event: "error", message: String(e.message || e) });
      });

      post({ event: "ready" });
    })();
  </script>
</body>
</html>
