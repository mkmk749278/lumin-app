name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Needed for the auto-release step at the end (creates a GitHub
    # Release tagged v{run_number} on every main push so the in-app
    # updater can pick it up).  ``contents: write`` is the only elevated
    # permission required; everything else stays at the default read.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate platform scaffolding (idempotent)
        run: |
          if [ ! -d "android" ]; then
            echo "First build — generating Android scaffolding"
            flutter create -t app --org=org.luminapp --platforms=android --project-name=lumin .
          else
            echo "android/ exists — skipping scaffolding"
          fi
          # flutter create -t app also drops a default test/widget_test.dart
          # that references a non-existent ``MyApp`` constructor (this app's
          # root widget is ``LuminApp``).  Until #28 / Phase 4 added real
          # tests, ``flutter test`` was never wired so this stub never
          # surfaced; once wired it fails compile in lockstep with our real
          # tests.  Drop the stub so our test/ tree is what runs.
          rm -f test/widget_test.dart

      - name: Inject INTERNET permission into release manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i "s|<application|<uses-permission android:name=\"android.permission.INTERNET\" />\n    <application|" "$MANIFEST"
            echo "Added INTERNET permission"
          else
            echo "INTERNET permission already present"
          fi
          grep INTERNET "$MANIFEST" || (echo "FAIL: missing" && exit 1)

      - name: Inject REQUEST_INSTALL_PACKAGES permission for in-app updater
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.REQUEST_INSTALL_PACKAGES" "$MANIFEST"; then
            sed -i "s|<application|<uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\" />\n    <application|" "$MANIFEST"
            echo "Added REQUEST_INSTALL_PACKAGES permission"
          else
            echo "REQUEST_INSTALL_PACKAGES permission already present"
          fi
          grep REQUEST_INSTALL_PACKAGES "$MANIFEST" || (echo "FAIL: missing" && exit 1)

      - name: Inject POST_NOTIFICATIONS permission for FCM push (Android 13+)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i "s|<application|<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n    <application|" "$MANIFEST"
            echo "Added POST_NOTIFICATIONS permission"
          else
            echo "POST_NOTIFICATIONS permission already present"
          fi
          grep POST_NOTIFICATIONS "$MANIFEST" || (echo "FAIL: missing" && exit 1)

      - name: Inject google-services.json (if secret is set)
        id: gs_json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret not set — skipping Firebase wiring for this build"
            echo "Owner uploads it via Repo Settings → Secrets and Variables → Actions"
            echo "wired=false" >> "$GITHUB_OUTPUT"
          else
            mkdir -p android/app
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written ($(wc -c < android/app/google-services.json) bytes)"
            echo "wired=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate firebase_options.dart android block from google-services.json
        if: steps.gs_json.outputs.wired == 'true'
        run: |
          set -eu
          GS=android/app/google-services.json
          API_KEY=$(jq -r '.client[0].api_key[0].current_key // empty' "$GS")
          APP_ID=$(jq -r '.client[0].client_info.mobilesdk_app_id // empty' "$GS")
          SENDER_ID=$(jq -r '.project_info.project_number // empty' "$GS")
          PROJECT_ID=$(jq -r '.project_info.project_id // empty' "$GS")
          STORAGE_BUCKET=$(jq -r '.project_info.storage_bucket // empty' "$GS")

          # Defensive: fail fast if any required field is missing — surfaces
          # a malformed google-services.json before flutter build wastes time.
          for v in "API_KEY=$API_KEY" "APP_ID=$APP_ID" "SENDER_ID=$SENDER_ID" "PROJECT_ID=$PROJECT_ID" "STORAGE_BUCKET=$STORAGE_BUCKET"; do
            key="${v%%=*}"; val="${v#*=}"
            if [ -z "$val" ]; then
              echo "ERROR: $key is empty in google-services.json — verify the file is the correct one from Firebase Console"
              echo "(structure expected: client[0].api_key[0].current_key, client[0].client_info.mobilesdk_app_id, project_info.{project_number,project_id,storage_bucket})"
              exit 1
            fi
          done

          # Substitute placeholders only inside the android FirebaseOptions block.
          # iOS and web blocks retain their TODO placeholders until those targets ship.
          sed -i "/^  static const FirebaseOptions android = FirebaseOptions(/,/^  );/ {
            s|^    apiKey: .*|    apiKey: '$API_KEY',|
            s|^    appId: .*|    appId: '$APP_ID',|
            s|^    messagingSenderId: .*|    messagingSenderId: '$SENDER_ID',|
            s|^    projectId: .*|    projectId: '$PROJECT_ID',|
            s|^    storageBucket: .*|    storageBucket: '$STORAGE_BUCKET',|
          }" lib/firebase_options.dart

          echo "--- firebase_options.dart android block after substitution ---"
          sed -n '/^  static const FirebaseOptions android = FirebaseOptions(/,/^  );/p' lib/firebase_options.dart

      - name: Apply google-services Gradle plugin (DSL-agnostic)
        if: steps.gs_json.outputs.wired == 'true'
        run: |
          set -eu
          # Modern Flutter (3.27+) generates Kotlin DSL build.gradle.kts;
          # older projects generate Groovy build.gradle. Detect which is
          # in use and patch accordingly. Idempotent — re-running over a
          # patched tree is a no-op.

          if [ -f android/settings.gradle.kts ]; then
            echo "Detected Kotlin DSL"

            # Root: add plugin declaration to settings.gradle.kts plugins block.
            if ! grep -q "com.google.gms.google-services" android/settings.gradle.kts; then
              sed -i '/^plugins {/a\    id("com.google.gms.google-services") version "4.4.4" apply false' android/settings.gradle.kts
              echo "Patched android/settings.gradle.kts"
            fi

            # App module: apply plugin in app/build.gradle.kts plugins block.
            if ! grep -q "com.google.gms.google-services" android/app/build.gradle.kts; then
              sed -i '/^plugins {/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
              echo "Patched android/app/build.gradle.kts"
            fi

          elif [ -f android/build.gradle ]; then
            echo "Detected Groovy DSL"

            # Root: add buildscript classpath in build.gradle.
            if ! grep -q "com.google.gms:google-services" android/build.gradle; then
              sed -i "/classpath 'com.android.tools.build:gradle/a\\        classpath 'com.google.gms:google-services:4.4.4'" android/build.gradle
              echo "Patched android/build.gradle"
            fi

            # App module: apply plugin in app/build.gradle.
            if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
              printf '\napply plugin: %s\n' "'com.google.gms.google-services'" >> android/app/build.gradle
              echo "Patched android/app/build.gradle"
            fi

          else
            echo "ERROR: neither android/settings.gradle.kts nor android/build.gradle found"
            echo "android/ tree:"
            ls -la android/
            exit 1
          fi

          echo "--- google-services references after patch ---"
          grep -rE "google.?services" android/*.gradle* android/app/*.gradle* 2>/dev/null || echo "(none)"

      - name: Get dependencies
        run: flutter pub get

      - name: Run unit tests
        # First-wave money-path coverage: HMAC signing in BinanceClient,
        # idempotency + capacity-prune in OrderLogService, settings
        # validation + idempotency short-circuit in OrderExecutor.
        # Second wave (2026-07-17): per-user Binance key custody, the
        # sideload self-updater, Play Billing verify glue, boot config
        # selection, and HTTP-level LuminApiClient / HttpRepository tests.
        # Adding tests gates this build job so a regression in the
        # money-moving layer blocks the APK before subscribers install.
        # --coverage writes coverage/lcov.info for the summary step below;
        # coverage is reported, never gated — a dip must not block a fix.
        run: flutter test --reporter=expanded --coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            echo '## Test coverage' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            awk -F'[:,]' '
              /^SF:/ { file=$2 }
              /^LF:/ { lf=$2 }
              /^LH:/ { lh=$2 }
              /^end_of_record/ {
                total_lf+=lf; total_lh+=lh;
                pct = (lf>0) ? 100*lh/lf : 0;
                printf "%6.1f%%  %s\n", pct, file;
              }
              END {
                if (total_lf>0) printf "%6.1f%%  TOTAL\n", 100*total_lh/total_lf;
              }
            ' coverage/lcov.info | sort -n >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Decode keystore (release only)
        if: env.ANDROID_KEYSTORE_B64 != ''
        id: keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/release-keystore.jks
          echo "storeFile=release-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "wired=true" >> "$GITHUB_OUTPUT"

      - name: Patch app/build.gradle.kts to use release signing config
        # Required because `flutter create` generates a build.gradle.kts
        # that signs release builds with the *debug* keystore by default
        # (with a TODO comment to fix it). Without this patch, the APK
        # ends up signed by `CN=Android Debug` even when ANDROID_KEYSTORE_B64
        # is set, key.properties is written, and the build "succeeds" —
        # exactly the silent failure that produced the 2026-05-15
        # Firebase Phone Auth `Invalid app info in play_integrity_token`
        # error after we registered SHAs of the actual release keystore.
        if: steps.keystore.outputs.wired == 'true'
        run: |
          set -eu
          if [ -f android/app/build.gradle.kts ]; then
            python3 << 'PYEOF'
          from pathlib import Path

          kts = Path('android/app/build.gradle.kts')
          content = kts.read_text()
          original = content

          # 1) Top-level imports (idempotent).
          if 'java.util.Properties' not in content:
              content = (
                  'import java.util.Properties\n'
                  'import java.io.FileInputStream\n'
                  '\n'
              ) + content
              print('Added Properties / FileInputStream imports')

          # 2) Top-level keystore properties loader, before `android {`.
          if 'val keystoreProperties' not in content:
              loader = (
                  '\n'
                  'val keystoreProperties = Properties()\n'
                  'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                  '}\n'
                  '\n'
              )
              if 'android {' in content:
                  content = content.replace('android {', loader + 'android {', 1)
                  print('Added keystoreProperties loader')
              else:
                  raise SystemExit('ERROR: android { ... } block not found in build.gradle.kts')

          # 3) signingConfigs block inside `android { ... }`, before `buildTypes {`.
          if 'signingConfigs {' not in content:
              signing = (
                  '    signingConfigs {\n'
                  '        create("release") {\n'
                  '            if (keystorePropertiesFile.exists()) {\n'
                  '                keyAlias = keystoreProperties["keyAlias"] as String\n'
                  '                keyPassword = keystoreProperties["keyPassword"] as String\n'
                  '                storeFile = file(keystoreProperties["storeFile"] as String)\n'
                  '                storePassword = keystoreProperties["storePassword"] as String\n'
                  '            }\n'
                  '        }\n'
                  '    }\n'
                  '\n'
              )
              if '    buildTypes {' in content:
                  content = content.replace('    buildTypes {', signing + '    buildTypes {', 1)
                  print('Added signingConfigs.release block')
              else:
                  raise SystemExit('ERROR: buildTypes { ... } block not found at expected indent')

          # 4) Switch release buildType from debug → release signing config.
          for pat in (
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig signingConfigs.debug',  # Groovy-style — defensive
          ):
              if pat in content:
                  content = content.replace(pat, 'signingConfig = signingConfigs.getByName("release")')
                  print(f'Switched {pat!r} → release')

          if content == original:
              print('No changes — file may already be patched (idempotent re-run).')
          else:
              kts.write_text(content)
              print('--- Patched android/app/build.gradle.kts ---')
              print(content)
          PYEOF
          elif [ -f android/app/build.gradle ]; then
            echo "ERROR: Groovy DSL detected; this patch step only handles Kotlin DSL."
            echo "Add a Groovy-side patch here when Flutter regresses, or update flutter create to force Kotlin DSL."
            exit 1
          else
            echo "ERROR: android/app/build.gradle.kts not found — flutter create didn't run?"
            exit 1
          fi

      - name: Enable full R8 optimisation (Play recommendation, release 282)
        # Play Console flagged the app at ~46% optimisation/obfuscation/
        # shrinking rates — flutter create's template release buildType never
        # sets isMinifyEnabled/isShrinkResources, so R8 ran in its default
        # partial mode.  Full R8 + resource shrinking cuts APK/AAB size and
        # memory; the keeps in proguard-rules.pro cover the classes R8 can't
        # see (Flutter JNI embedding, Play Core split-install references from
        # Flutter's deferred-components support).  Runs on PR builds too, so
        # an R8-stripped-too-much regression fails CI before merge.
        run: |
          set -eu
          cat > android/app/proguard-rules.pro << 'RULES'
          # Flutter engine + embedding: entry points invoked from native/JNI,
          # invisible to R8's reachability analysis.
          -keep class io.flutter.** { *; }
          # Play Core split-install: referenced by Flutter's deferred-components
          # plumbing even when the app uses none — R8 full mode fails the build
          # or strips them without an explicit keep.
          -keep class com.google.android.play.core.** { *; }
          -dontwarn com.google.android.play.core.**
          # Firebase Phone Auth app verification (2026-07-17): the first full-R8
          # release (v287) broke sign-in on SIDELOADED installs with "missing a
          # valid app identifier … Play Integrity checks, and reCAPTCHA checks
          # were unsuccessful" — pre-R8 builds sign in fine, Play installs pass
          # via Play Integrity.  A sideloaded install can only authenticate
          # through the reCAPTCHA fallback, and R8 full mode strips/renames
          # parts of that path despite the AARs' consumer rules.  Keep the
          # reCAPTCHA client SDK and the Firebase Auth surface — these are
          # public Google SDKs, so keeping their names costs no meaningful
          # obfuscation (our own code is protected by --obfuscate on the Dart
          # side).  The sideload GitHub-Releases channel is production for
          # pre-Play installs, not just a test convenience.
          -keep class com.google.android.recaptcha.** { *; }
          -dontwarn com.google.android.recaptcha.**
          -keep class com.google.firebase.auth.** { *; }
          # Other Firebase / Play services / Billing libs ship consumer keep
          # rules inside their AARs that full mode does honour — no further
          # blanket keeps unless a regression proves otherwise.
          RULES
          python3 << 'PYEOF'
          from pathlib import Path

          kts = Path('android/app/build.gradle.kts')
          content = kts.read_text()
          if 'isMinifyEnabled' in content:
              print('R8 already configured — idempotent re-run.')
              raise SystemExit(0)
          anchor = 'signingConfig = signingConfigs.getByName('
          idx = content.find(anchor)
          if idx == -1:
              raise SystemExit('ERROR: release signingConfig line not found — template drifted?')
          line_end = content.index('\n', idx)
          insert = (
              '\n'
              '            isMinifyEnabled = true\n'
              '            isShrinkResources = true\n'
              '            proguardFiles(\n'
              '                getDefaultProguardFile("proguard-android-optimize.txt"),\n'
              '                "proguard-rules.pro",\n'
              '            )'
          )
          content = content[:line_end] + insert + content[line_end:]
          kts.write_text(content)
          print('--- release buildType after R8 patch ---')
          start = content.index('buildTypes')
          print(content[start:start + 600])
          PYEOF

      - name: Build release APK
        # --obfuscate (audit F-12/M-1): the app gates the paid Assist tier
        # client-side and composes Binance orders on-device — plain Dart
        # symbols made both trivially readable/patchable.  Symbol maps are
        # uploaded as an artifact below so release crash traces remain
        # de-obfuscatable (flutter symbolize -d <trace> -i <symbols>).
        run: |
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols/apk \
            --build-name=${{ github.ref_name }} \
            --build-number=${{ github.run_number }}

      - name: Verify APK was signed with release keystore (not debug)
        # Defensive: detect the silent-debug-signing failure mode that
        # the build.gradle.kts patch is meant to fix. If apksigner shows
        # CN=Android Debug, we fail the build loudly rather than ship an
        # APK that will trip Firebase Phone Auth's play_integrity check
        # in the field.
        if: steps.keystore.outputs.wired == 'true'
        run: |
          set -eu
          APK=$(ls build/app/outputs/flutter-apk/*-release.apk build/app/outputs/flutter-apk/lumin-*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: no APK found to verify"
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi
          # apksigner is in build-tools; flutter-action puts it on PATH.
          CERT_DN=$(apksigner verify --print-certs "$APK" 2>&1 | grep 'Signer #1 certificate DN' || true)
          echo "$CERT_DN"
          if echo "$CERT_DN" | grep -q "CN=Android Debug"; then
            echo "FAIL: APK is signed with debug keystore. The build.gradle.kts patch did not stick."
            exit 1
          fi
          echo "OK: APK is signed with release keystore."

      - name: Rename APK with run number
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk lumin-${{ github.run_number }}.apk
          ls -la

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumin-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/lumin-*.apk
          retention-days: 30

      # Play Store launch (2026-05-21) — strip sensitive permissions
      # from the manifest BEFORE the AAB build so the Play-distributed
      # version doesn't trigger declaration-required errors on Play
      # Console.  The sideload APK above keeps the permissions
      # (in-app updater + open_filex install activity); the AAB
      # ships without them since Play handles updates natively and
      # we never actually access user photos/videos/audio.
      - name: Strip Play-sensitive permissions from manifest before AAB build
        run: |
          set -eu
          python3 << 'PYEOF'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          content = p.read_text()
          print('--- Manifest BEFORE strip ---')
          print(content)

          # 1. Remove REQUEST_INSTALL_PACKAGES (in-app updater — not
          #    needed for Play Store builds).
          lines = content.split('\n')
          lines = [
              line for line in lines
              if 'android.permission.REQUEST_INSTALL_PACKAGES' not in line
          ]
          content = '\n'.join(lines)

          # 2. Ensure tools namespace is on the root manifest tag so
          #    we can use tools:node="remove" directives.
          if 'xmlns:tools=' not in content:
              content = content.replace(
                  '<manifest ',
                  '<manifest xmlns:tools="http://schemas.android.com/tools" ',
                  1,
              )

          # 3. Insert tools:node="remove" entries for media permissions
          #    that Flutter dependencies (open_filex, permission_handler,
          #    image_picker transitive deps) may auto-merge into the
          #    final manifest.  Play Console rejects any photo/video/
          #    audio permission without an explicit declaration form,
          #    and we don't use any of these.
          removes = [
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" tools:node="remove" />',
              '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" tools:node="remove" />',
              '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" tools:node="remove" />',
              '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" tools:node="remove" />',
              '    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" tools:node="remove" />',
              '    <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED" tools:node="remove" />',
          ]
          if 'READ_EXTERNAL_STORAGE" tools:node="remove"' not in content:
              inject_block = '\n'.join(removes) + '\n    <application'
              if '    <application' in content:
                  content = content.replace(
                      '    <application',
                      inject_block,
                      1,
                  )
              elif '<application' in content:
                  content = content.replace(
                      '<application',
                      inject_block.lstrip(),
                      1,
                  )
              else:
                  raise SystemExit(
                      'ERROR: <application> tag not found — cannot inject media-permission removers'
                  )

          p.write_text(content)
          print('--- Manifest AFTER strip ---')
          print(content)
          PYEOF

      # Play Store launch (2026-05-20) — Play Console requires an
      # AAB (Android App Bundle), not an APK, for all new submissions
      # since August 2021.  Same signing config + same keystore as
      # the APK; just a different ``flutter build`` target.  We keep
      # the APK build above for in-app-updater + sideload paths,
      # and ship the AAB only as a downloadable artifact (Play
      # uploads happen manually via the Play Console UI for v1).
      - name: Build release AAB
        # Same obfuscation as the APK (audit F-12) — the Play build is the
        # one real users install, it must not be the un-obfuscated variant.
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols/aab \
            --dart-define=LUMIN_DISTRIBUTION=play \
            --build-name=${{ github.ref_name }} \
            --build-number=${{ github.run_number }}

      - name: Rename AAB with run number
        run: |
          cd build/app/outputs/bundle/release
          mv app-release.aab lumin-${{ github.run_number }}.aab
          ls -la

      - name: Upload AAB artifact (for Play Console upload)
        uses: actions/upload-artifact@v4
        with:
          name: lumin-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/lumin-*.aab
          retention-days: 30

      - name: Upload obfuscation symbol maps
        # Without these, a production crash trace from an obfuscated build
        # is undecodable.  Keep 90 days — longer than the release cadence.
        uses: actions/upload-artifact@v4
        with:
          name: lumin-symbols-${{ github.run_number }}
          path: build/symbols/
          retention-days: 90
          if-no-files-found: error

      - name: Attach APK + AAB to existing GitHub Release (manual release event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          # AAB attached alongside the APK (2026-07-16): the Play upload is
          # manual (docs/PLAYSTORE_BUILD.md), so the owner downloads the AAB
          # straight from the Releases page instead of digging out a 30-day
          # workflow artifact.
          files: |
            build/app/outputs/flutter-apk/lumin-*.apk
            build/app/outputs/bundle/release/lumin-*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-create GitHub Release for in-app updater (main push only)
        # Every push to main produces an immutable release tagged
        # ``v{run_number}``.  The Lumin app polls
        # ``/repos/{owner}/{repo}/releases/latest`` and surfaces an
        # update banner when the latest tag's build number exceeds the
        # installed PackageInfo.buildNumber.  Skips on PR builds (no
        # write perms, would 403) and on the manual ``release`` event
        # (handled by the step above).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: v${{ github.run_number }}
          body: |
            Auto-build #${{ github.run_number }} from ${{ github.sha }}.

            Commit: ${{ github.event.head_commit.message }}
          # APK feeds the in-app updater; the AAB rides along so the Play
          # Console upload is a one-click download from the Releases page.
          files: |
            build/app/outputs/flutter-apk/lumin-*.apk
            build/app/outputs/bundle/release/lumin-*.aab
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────────────────────────
  # Web (PWA) channel — the iPhone path (2026-07-18).  No Apple account
  # required: users add app.luminapp.org to their Home Screen.  Web
  # deploys ARE the update mechanism, so this job both builds and (on
  # main) ships to the VPS static root that nginx serves for
  # app.luminapp.org (server block provisioned by 360-v2's
  # tools/setup-vps-api.sh).
  build-web:
    name: Build web app (PWA)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Inject firebase_options.dart web block (if secret is set)
        id: fb_web
        env:
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: |
          if [ -z "$FIREBASE_WEB_CONFIG" ]; then
            echo "FIREBASE_WEB_CONFIG secret not set — building with placeholder Firebase config"
            echo "Owner: register a Web App in the Firebase console, then save its config"
            echo "object as the FIREBASE_WEB_CONFIG secret (JSON with apiKey, appId,"
            echo "messagingSenderId, projectId, authDomain, storageBucket)."
            echo "wired=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -eu
          API_KEY=$(echo "$FIREBASE_WEB_CONFIG" | jq -r '.apiKey // empty')
          APP_ID=$(echo "$FIREBASE_WEB_CONFIG" | jq -r '.appId // empty')
          SENDER_ID=$(echo "$FIREBASE_WEB_CONFIG" | jq -r '.messagingSenderId // empty')
          PROJECT_ID=$(echo "$FIREBASE_WEB_CONFIG" | jq -r '.projectId // empty')
          AUTH_DOMAIN=$(echo "$FIREBASE_WEB_CONFIG" | jq -r '.authDomain // empty')
          STORAGE_BUCKET=$(echo "$FIREBASE_WEB_CONFIG" | jq -r '.storageBucket // empty')

          # Defensive: fail fast on a malformed secret — mirrors the android
          # google-services.json injection step.
          for v in "API_KEY=$API_KEY" "APP_ID=$APP_ID" "SENDER_ID=$SENDER_ID" "PROJECT_ID=$PROJECT_ID" "AUTH_DOMAIN=$AUTH_DOMAIN" "STORAGE_BUCKET=$STORAGE_BUCKET"; do
            key="${v%%=*}"; val="${v#*=}"
            if [ -z "$val" ]; then
              echo "ERROR: $key is empty in FIREBASE_WEB_CONFIG — paste the config object"
              echo "from Firebase Console → Project settings → Your apps → Web app"
              exit 1
            fi
          done

          # Substitute placeholders only inside the web FirebaseOptions block.
          sed -i "/^  static const FirebaseOptions web = FirebaseOptions(/,/^  );/ {
            s|^    apiKey: .*|    apiKey: '$API_KEY',|
            s|^    appId: .*|    appId: '$APP_ID',|
            s|^    messagingSenderId: .*|    messagingSenderId: '$SENDER_ID',|
            s|^    projectId: .*|    projectId: '$PROJECT_ID',|
            s|^    authDomain: .*|    authDomain: '$AUTH_DOMAIN',|
            s|^    storageBucket: .*|    storageBucket: '$STORAGE_BUCKET',|
          }" lib/firebase_options.dart

          # The FCM service worker can't read Dart config — substitute the
          # same values into its placeholders so background delivery works.
          sed -i \
            -e "s|<FIREBASE_API_KEY>|$API_KEY|" \
            -e "s|<FIREBASE_APP_ID>|$APP_ID|" \
            -e "s|<FIREBASE_SENDER_ID>|$SENDER_ID|" \
            -e "s|<FIREBASE_PROJECT_ID>|$PROJECT_ID|" \
            -e "s|<FIREBASE_AUTH_DOMAIN>|$AUTH_DOMAIN|" \
            -e "s|<FIREBASE_STORAGE_BUCKET>|$STORAGE_BUCKET|" \
            web/firebase-messaging-sw.js
          echo "wired=true" >> "$GITHUB_OUTPUT"

      - name: Get dependencies
        run: flutter pub get

      - name: Build web (release)
        # LUMIN_DISTRIBUTION=web keeps the self-updater inert (web deploys
        # are the update mechanism) and is the compile-time channel token —
        # see lib/app/distribution.dart.
        env:
          # Web-push VAPID public key (Firebase Console → Cloud Messaging →
          # Web configuration).  Empty (push stays unarmed, app still works)
          # until the owner adds the FCM_VAPID_KEY secret.
          FCM_VAPID_KEY: ${{ secrets.FCM_VAPID_KEY }}
        run: |
          flutter build web --release \
            --dart-define=LUMIN_DISTRIBUTION=web \
            --dart-define=LUMIN_FCM_VAPID_KEY="$FCM_VAPID_KEY" \
            --build-number=${{ github.run_number }}

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumin-web-${{ github.run_number }}
          path: build/web/
          retention-days: 30

      - name: Package web build for deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -C build/web -czf lumin-web.tar.gz .

      - name: Copy web build to VPS (main push only)
        # Same VPS + secret names as 360-v2's deploy.yml.  Skips cleanly
        # until the owner adds VPS_HOST / VPS_USER / VPS_SSH_KEY secrets
        # to THIS repo.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.VPS_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: lumin-web.tar.gz
          target: /tmp/

      - name: Activate web deploy on VPS (atomic swap)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            ROOT=/var/www/app.luminapp.org
            STAGE=$(mktemp -d /var/www/.lumin-web-stage.XXXXXX)
            tar -C "$STAGE" -xzf /tmp/lumin-web.tar.gz
            rm -f /tmp/lumin-web.tar.gz
            mkdir -p "$ROOT"
            # Swap the docroot atomically-enough for a static site: stage
            # fully extracted first, then a rename dance so nginx never
            # serves a half-written tree.
            OLD="$ROOT.old.$$"
            mv "$ROOT" "$OLD"
            mv "$STAGE" "$ROOT"
            chmod 755 "$ROOT"
            rm -rf "$OLD"
            echo "✅ web deploy live at $ROOT (build ${{ github.run_number }})"
