name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Needed for the auto-release step at the end (creates a GitHub
    # Release tagged v{run_number} on every main push so the in-app
    # updater can pick it up).  ``contents: write`` is the only elevated
    # permission required; everything else stays at the default read.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate platform scaffolding (idempotent)
        run: |
          if [ ! -d "android" ]; then
            echo "First build — generating Android scaffolding"
            flutter create -t app --org=org.luminapp --platforms=android --project-name=lumin .
          else
            echo "android/ exists — skipping scaffolding"
          fi

      - name: Inject INTERNET permission into release manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i "s|<application|<uses-permission android:name=\"android.permission.INTERNET\" />\n    <application|" "$MANIFEST"
            echo "Added INTERNET permission"
          else
            echo "INTERNET permission already present"
          fi
          grep INTERNET "$MANIFEST" || (echo "FAIL: missing" && exit 1)

      - name: Inject REQUEST_INSTALL_PACKAGES permission for in-app updater
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.REQUEST_INSTALL_PACKAGES" "$MANIFEST"; then
            sed -i "s|<application|<uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\" />\n    <application|" "$MANIFEST"
            echo "Added REQUEST_INSTALL_PACKAGES permission"
          else
            echo "REQUEST_INSTALL_PACKAGES permission already present"
          fi
          grep REQUEST_INSTALL_PACKAGES "$MANIFEST" || (echo "FAIL: missing" && exit 1)

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret not set — Firebase auth will not work in this build"
            echo "Owner must upload it via Repo Settings → Secrets → Actions"
            # Create empty placeholder so the gradle plugin doesn't fail with a missing-file error
            mkdir -p android/app
            echo '{}' > android/app/google-services.json
          else
            mkdir -p android/app
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Patch android/build.gradle for Google services plugin
        run: |
          # Idempotent: only insert if not already present
          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i "/classpath 'com.android.tools.build:gradle/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          fi

      - name: Patch android/app/build.gradle for plugin apply
        run: |
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "" >> android/app/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Decode keystore (release only)
        if: env.ANDROID_KEYSTORE_B64 != ''
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/release-keystore.jks
          echo "storeFile=release-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ github.ref_name }} \
            --build-number=${{ github.run_number }}

      - name: Rename APK with run number
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk lumin-${{ github.run_number }}.apk
          ls -la

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumin-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/lumin-*.apk
          retention-days: 30

      - name: Attach APK to existing GitHub Release (manual release event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/lumin-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-create GitHub Release for in-app updater (main push only)
        # Every push to main produces an immutable release tagged
        # ``v{run_number}``.  The Lumin app polls
        # ``/repos/{owner}/{repo}/releases/latest`` and surfaces an
        # update banner when the latest tag's build number exceeds the
        # installed PackageInfo.buildNumber.  Skips on PR builds (no
        # write perms, would 403) and on the manual ``release`` event
        # (handled by the step above).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: v${{ github.run_number }}
          body: |
            Auto-build #${{ github.run_number }} from ${{ github.sha }}.

            Commit: ${{ github.event.head_commit.message }}
          files: build/app/outputs/flutter-apk/lumin-*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
