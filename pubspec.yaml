name: lumin
description: "Lumin — AI Crypto Trading. Mobile app for 360 Crypto Eye signals."
publish_to: "none"
version: 0.1.0+23

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  http: ^1.2.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.0
  # In-app update flow (download + install signed APK from latest GitHub Release).
  package_info_plus: ^8.0.0
  dio: ^5.7.0
  open_filex: ^4.5.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  # Phase 3 — HMAC-SHA256 signing for Binance Futures REST.  The engine
  # never holds user Binance keys; the app fires the user's order with
  # keys held in flutter_secure_storage.
  crypto: ^3.0.3
  # Play Store launch (A5, 2026-05-20) — Settings → Legal links open
  # the privacy / terms / risk URLs in the device browser.
  url_launcher: ^6.3.0
  # B16 — Google Play Billing.  Subscriptions are purchased via Play
  # Billing; the resulting purchaseToken is verified server-side by the
  # engine (POST /api/billing/play/verify), which is the entitlement
  # source of truth.  Telegram-bot payment retired (Telegram banned
  # in-region).
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
